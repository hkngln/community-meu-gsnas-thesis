name: Release

# When dev is merged into main, the version in typst.toml is released: a vX.Y.Z
# tag and a GitHub Release with the example thesis PDF. Nothing happens if the
# tag already exists.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only macOS runners ship Times New Roman.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: ./.github/actions/setup

      - if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash tests/verify.sh
          cp tests/out/template.pdf "community-meu-gsnas-thesis-example-v$VERSION.pdf"

      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: community-meu-gsnas-thesis-example-v${{ steps.version.outputs.version }}.pdf
