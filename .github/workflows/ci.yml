name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-rule:
    name: Branch rule
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          echo "PR: $SOURCE -> $TARGET"
          if [[ "$TARGET" == "main" && "$SOURCE" != "dev" ]]; then
            echo "::error::Pull requests into main may only come from dev."
            exit 1
          fi
          if [[ "$TARGET" == "dev" && ! "$SOURCE" =~ ^(feat|fix|docs|refactor|test|ci|chore|perf)/[a-z0-9._-]+$ ]]; then
            echo "::error::Branches merged into dev must be named <type>/<short-name> (e.g. feat/appendix-numbering). See CONTRIBUTING.md"
            exit 1
          fi

  version-check:
    name: Version check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The typst.toml version must not be released yet
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Bump the version in typst.toml before merging into main."
            exit 1
          fi
          echo "Version to release: v$VERSION"

  build:
    name: Build and verify
    # Only macOS runners ship Times New Roman.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bash tests/verify.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-outputs
          path: tests/out/*.pdf
          if-no-files-found: ignore
