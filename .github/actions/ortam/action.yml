name: Derleme ortamı
description: Typst ve poppler kurar, paketi @local olarak bağlar. macOS runner gerektirir.

# macOS: Times New Roman sistemle gelir. Linux'taki ttf-mscorefonts-installer
# fontu kurulum anında SourceForge'dan indirir ve CI'da sessizce başarısız olur.
runs:
  using: composite
  steps:
    - name: Times New Roman kontrolü
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "macOS" ]]; then
          echo "::error::Bu action macOS runner gerektirir (Times New Roman)."
          exit 1
        fi
        ls "/System/Library/Fonts/Supplemental/Times New Roman.ttf"

    - name: poppler (pdftotext)
      shell: bash
      run: brew install --quiet poppler

    - uses: typst-community/setup-typst@v5
      with:
        typst-version: 0.15.1

    - name: Paketi @local/community-meu-gsnas-thesis olarak bağla
      shell: bash
      run: |
        SURUM=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml)
        HEDEF="$HOME/Library/Application Support/typst/packages/local/community-meu-gsnas-thesis"
        mkdir -p "$HEDEF"
        ln -sfn "$GITHUB_WORKSPACE" "$HEDEF/$SURUM"
        grep -q "Times New Roman" <<<"$(typst fonts)" || { echo "::error::Typst Times New Roman bulamadı"; exit 1; }
